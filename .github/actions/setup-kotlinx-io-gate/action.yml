name: Setup kotlinx-io gate toolchain
description: Select Swift 6.3 and configure the macOS LLVM/SDK toolchain used by the focused IO gate.

inputs:
  swift-version:
    description: Required Swift major and minor version.
    required: false
    default: "6.3"

runs:
  using: composite
  steps:
    - name: Select an installed Xcode that provides the requested Swift version
      shell: bash
      env:
        REQUIRED_SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import glob
        import os
        import pathlib
        import re
        import subprocess

        required = os.environ["REQUIRED_SWIFT_VERSION"]
        active = subprocess.check_output(["xcode-select", "--print-path"], text=True).strip()
        candidates = list(dict.fromkeys([active] + sorted(
            glob.glob("/Applications/Xcode*.app/Contents/Developer"), reverse=True)))
        selected = None
        for developer in candidates:
            swift = pathlib.Path(developer) / "Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if not swift.is_file():
                continue
            result = subprocess.run([str(swift), "--version"], text=True,
                stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
            match = re.search(r"Swift version ([0-9]+\.[0-9]+)(?:\.|\s|$)", result.stdout)
            if result.returncode == 0 and match and match.group(1) == required:
                selected = developer
                break
        if selected is None:
            raise SystemExit(f"No installed full Xcode provides Swift {required}")
        destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "kotlinx-io-selected-xcode.txt"
        destination.write_text(selected + "\n")
        print(selected)
        PY
        selected_developer_dir="$(cat "$RUNNER_TEMP/kotlinx-io-selected-xcode.txt")"
        sudo xcode-select --switch "$selected_developer_dir"

    - name: Configure Swift, LLVM, GNU tools and Apple SDK
      shell: bash
      env:
        REQUIRED_SWIFT_VERSION: ${{ inputs.swift-version }}
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        set -euo pipefail
        swift --version
        swift_version="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
        [[ "$swift_version" == "$REQUIRED_SWIFT_VERSION" || "$swift_version" == "$REQUIRED_SWIFT_VERSION".* ]]
        brew install bash grep llvm
        bash_prefix="$(brew --prefix bash)"
        grep_prefix="$(brew --prefix grep)"
        llvm_prefix="$(brew --prefix llvm)"
        llvm_dylib="$llvm_prefix/lib/libLLVM.dylib"
        [[ -f "$llvm_dylib" ]]
        sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
        [[ -d "$sdkroot/System/Library/Frameworks/Foundation.framework" ]]
        [[ -d "$sdkroot/System/Library/Frameworks/CoreFoundation.framework" ]]
        {
          echo "$bash_prefix/bin"
          echo "$grep_prefix/libexec/gnubin"
          echo "$llvm_prefix/bin"
        } >> "$GITHUB_PATH"
        {
          echo "SDKROOT=$sdkroot"
          echo "KSWIFTK_LLVM_DYLIB=$llvm_dylib"
          echo "C_INCLUDE_PATH=$llvm_prefix/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
          echo "LIBRARY_PATH=$llvm_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
        } >> "$GITHUB_ENV"
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        llvm-config --version

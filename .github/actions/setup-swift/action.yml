name: Setup Swift
description: Configure Swift without privileged writes on macOS self-hosted runners.

inputs:
  swift-version:
    description: Required Swift major and minor version
    required: false
    default: "6.3"

runs:
  using: composite
  steps:
    - name: Install Swift on Linux
      if: runner.os == 'Linux'
      uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
      with:
        swift-version: ${{ inputs.swift-version }}

    - name: Shim libxml2.so.2 on newer Ubuntu runners
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Swift toolchains older than the first ubuntu2604 build link
        # libxml2.so.2, but Ubuntu 26.04 ships libxml2 2.13+ whose soname is
        # libxml2.so.16. Symlink the installed soname, mirroring
        # swiftlang/swift-docker#550. No-op once a libxml2.so.2 provider (or a
        # native ubuntu2604 toolchain) exists.
        multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || echo x86_64-linux-gnu)"
        libdir="/usr/lib/${multiarch}"
        if [[ -e "${libdir}/libxml2.so.2" ]]; then
          exit 0
        fi
        if ! compgen -G "${libdir}/libxml2.so.*" > /dev/null; then
          sudo apt-get update
          sudo apt-get install -y libxml2
        fi
        newest="$(find "${libdir}" -maxdepth 1 -name 'libxml2.so.*' -not -name 'libxml2.so' | sort -V | tail -1)"
        if [[ -z "$newest" ]]; then
          echo "No libxml2 shared object found under ${libdir} to shim libxml2.so.2" >&2
          exit 1
        fi
        sudo ln -sf "$newest" "${libdir}/libxml2.so.2"
        sudo ldconfig
        echo "Shimmed ${libdir}/libxml2.so.2 -> $newest"

    - name: Use Xcode Swift on macOS
      if: runner.os == 'macOS'
      shell: bash
      env:
        REQUIRED_SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        developer_dir="$(xcode-select --print-path)"
        swift_bin="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"

        if [[ ! -x "$swift_bin" ]]; then
          echo "Xcode Swift was not found at $swift_bin." >&2
          exit 1
        fi

        actual_swift_version="$("$swift_bin" --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
        if [[ -z "$actual_swift_version" ]]; then
          echo "Unable to determine the Xcode Swift version." >&2
          exit 1
        fi

        if [[ "$actual_swift_version" != "$REQUIRED_SWIFT_VERSION" && "$actual_swift_version" != "$REQUIRED_SWIFT_VERSION".* ]]; then
          echo "Xcode provides Swift $actual_swift_version, but Swift $REQUIRED_SWIFT_VERSION is required." >&2
          exit 1
        fi

        echo "$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        "$swift_bin" --version

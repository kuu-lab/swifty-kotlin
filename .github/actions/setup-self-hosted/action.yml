name: Prepare self-hosted runner
description: Install command-line prerequisites shared by Linux and macOS self-hosted runners.

runs:
  using: composite
  steps:
    - name: Prepare Linux runner
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v rg >/dev/null 2>&1; then
          exit 0
        fi

        if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ripgrep
          exit 0
        fi

        # Runner accounts without passwordless sudo cannot use apt-get, so fall
        # back to the upstream static build in a user-writable directory.
        case "$(uname -m)" in
          x86_64) target="x86_64-unknown-linux-musl" ;;
          aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
          *)
            echo "ripgrep is not installed and no prebuilt binary exists for $(uname -m)." >&2
            exit 1
            ;;
        esac

        version="14.1.1"
        archive="ripgrep-${version}-${target}"
        workdir="${RUNNER_TEMP:-/tmp}"
        install_dir="$HOME/.local/bin"
        mkdir -p "$install_dir"

        curl -fsSL -o "$workdir/$archive.tar.gz" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${version}/${archive}.tar.gz"
        tar -xzf "$workdir/$archive.tar.gz" -C "$workdir"
        install -m 0755 "$workdir/$archive/rg" "$install_dir/rg"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Prepare macOS runner
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew_bin=""
        for candidate in "$(command -v brew 2>/dev/null || true)" /opt/homebrew/bin/brew /usr/local/bin/brew; do
          if [[ -n "$candidate" && -x "$candidate" ]]; then
            brew_bin="$candidate"
            break
          fi
        done

        if [[ -z "$brew_bin" ]]; then
          echo "Homebrew is required on macOS self-hosted runners to install CI prerequisites." >&2
          exit 1
        fi

        brew_prefix="$($brew_bin --prefix)"
        export PATH="$brew_prefix/bin:$PATH"

        if ! command -v rg >/dev/null 2>&1; then
          "$brew_bin" install ripgrep
        fi

        bash_major="$(bash -c 'printf "%s" "${BASH_VERSINFO[0]}"' 2>/dev/null || printf '0')"
        if ! [[ "$bash_major" =~ ^[4-9][0-9]*$ ]] || ! "$brew_bin" list --formula bash >/dev/null 2>&1; then
          "$brew_bin" install bash
        fi

        bash_prefix="$($brew_bin --prefix bash)"
        {
          echo "$bash_prefix/bin"
          echo "$brew_prefix/bin"
        } >> "$GITHUB_PATH"

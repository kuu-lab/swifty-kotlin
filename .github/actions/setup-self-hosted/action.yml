name: Prepare self-hosted runner
description: Install command-line prerequisites shared by Linux and macOS self-hosted runners.

runs:
  using: composite
  steps:
    - name: Prepare Linux runner
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v rg >/dev/null 2>&1; then
          exit 0
        fi

        # Try passwordless apt first; if sudo requires a password (some self-hosted
        # runners are not configured for passwordless sudo), fall back to a
        # downloaded musl ripgrep binary.
        if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          if sudo apt-get update && sudo apt-get install -y ripgrep; then
            if command -v rg >/dev/null 2>&1; then
              exit 0
            fi
          fi
        fi

        rg_version="14.1.0"
        arch="$(uname -m)"
        case "$arch" in
          x86_64) rg_arch="x86_64-unknown-linux-musl" ;;
          aarch64|arm64) rg_arch="aarch64-unknown-linux-musl" ;;
          *) echo "Unsupported architecture for ripgrep fallback: $arch" >&2; exit 1 ;;
        esac

        install_dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/ripgrep-${rg_version}"
        mkdir -p "$install_dir"
        rg_url="https://github.com/BurntSushi/ripgrep/releases/download/${rg_version}/ripgrep-${rg_version}-${rg_arch}.tar.gz"
        curl -fsSL "$rg_url" | tar -xz --strip-components=1 -C "$install_dir"
        chmod +x "$install_dir/rg"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Prepare macOS runner
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew_bin=""
        for candidate in "$(command -v brew 2>/dev/null || true)" /opt/homebrew/bin/brew /usr/local/bin/brew; do
          if [[ -n "$candidate" && -x "$candidate" ]]; then
            brew_bin="$candidate"
            break
          fi
        done

        if [[ -z "$brew_bin" ]]; then
          echo "Homebrew is required on macOS self-hosted runners to install CI prerequisites." >&2
          exit 1
        fi

        brew_prefix="$($brew_bin --prefix)"
        export PATH="$brew_prefix/bin:$PATH"

        if ! command -v rg >/dev/null 2>&1; then
          "$brew_bin" install ripgrep
        fi

        bash_major="$(bash -c 'printf "%s" "${BASH_VERSINFO[0]}"' 2>/dev/null || printf '0')"
        if ! [[ "$bash_major" =~ ^[4-9][0-9]*$ ]] || ! "$brew_bin" list --formula bash >/dev/null 2>&1; then
          "$brew_bin" install bash
        fi

        bash_prefix="$($brew_bin --prefix bash)"
        {
          echo "$bash_prefix/bin"
          echo "$brew_prefix/bin"
        } >> "$GITHUB_PATH"

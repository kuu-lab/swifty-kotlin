name: Setup SwiftPM build cache
description: |
  Restore the SwiftPM .build directory and optionally save it after the job.
  Trusted default-branch runs should set save=true so pull requests can reuse
  their build products and compilation CAS. Cache compatibility is scoped to
  the runner, Swift toolchain, build variant, and files that control SwiftPM
  invocation. The commit SHA keeps saved caches immutable while restore keys
  fall back to the newest compatible default-branch cache.

inputs:
  swift-version:
    description: Swift toolchain version used in the cache key.
    required: true
  save:
    description: Set to 'true' to save the cache after this job completes.
    required: false
    default: "false"
  build-variant:
    description: Stable name for compiler flags and build configuration.
    required: false
    default: default

outputs:
  cache-hit:
    description: Whether the primary cache key matched exactly.
    value: ${{ steps.result.outputs.cache-hit }}
  cache-key:
    description: The primary cache key used for restore/save.
    value: ${{ steps.key.outputs.primary }}

runs:
  using: composite
  steps:
    - name: Compute SwiftPM cache key
      id: key
      shell: bash
      run: |
        build_input_hash="${{ hashFiles('Package.swift', 'Package.resolved', 'Scripts/build_swift_tests.sh', 'Scripts/swift_test.sh', 'Scripts/lib/common.sh', '.github/actions/setup-swift/action.yml', '.github/actions/setup-swiftpm-cache/action.yml') }}"
        variant="${{ inputs.build-variant }}"
        schema="v2"

        primary="swiftpm-${schema}-${{ runner.os }}-${{ runner.arch }}-swift-${{ inputs.swift-version }}-${build_input_hash}-${variant}-${{ github.sha }}"
        prefix="swiftpm-${schema}-${{ runner.os }}-${{ runner.arch }}-swift-${{ inputs.swift-version }}-${build_input_hash}-${variant}-"

        echo "primary=${primary}" >> "$GITHUB_OUTPUT"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"

    # actions/cache restores now and registers its save operation as a post-job
    # step, after the caller has populated .build.
    - name: Restore SwiftPM .build cache and schedule post-job save
      id: cache
      if: ${{ inputs.save == 'true' }}
      uses: actions/cache@v5
      with:
        path: .build
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}

    # Pull requests stay restore-only so untrusted code cannot publish caches.
    - name: Restore SwiftPM .build cache
      id: restore
      if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: .build
        key: ${{ steps.key.outputs.primary }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}

    - name: Export SwiftPM cache result
      id: result
      shell: bash
      env:
        SAVE_ENABLED: ${{ inputs.save }}
        SAVE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        RESTORE_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        if [[ "$SAVE_ENABLED" == "true" ]]; then
          cache_hit="$SAVE_CACHE_HIT"
        else
          cache_hit="$RESTORE_CACHE_HIT"
        fi
        echo "cache-hit=$cache_hit" >> "$GITHUB_OUTPUT"

name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A/B measurements showed that compiling CompilerCore with -O in debug builds
  # reduces the longest CI job (verify-core CompilerCore shards) by ~40% while
  # keeping all tests green. This only affects debug builds; release builds in
  # verify-diff are unchanged because the Package.swift guard is gated on
  # .when(configuration: .debug).
  KSWIFTK_OPTIMIZE_COMPILER_CORE: "1"

# Successive pushes to the same PR cancel all in-flight verification jobs.
# Non-PR events get a unique group per run and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Self-hosted TODO ID duplicate check. Gating once TODO.md duplicate IDs are cleaned up.
  verify-todo-ids:
    name: Verification 0/5 (TODO ID duplicate check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Prepare self-hosted runner
        uses: ./.github/actions/setup-self-hosted
      - name: Check for duplicate TODO task IDs
        run: bash Scripts/check_todo_ids.sh

  # CompilerCore and kotlinc-diff shards build in independent hosted workspaces.
  # Verification 2-4 shares one hosted build so expensive SwiftPM products are
  # reused within that lane.
  verify-core:
    name: Verification 1/5 (CompilerCore and Smoke, shard ${{ matrix.shard_label }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      # The compilation cache (cache-compile-job) CAS path, used by the legacy
      # native build system as well as swiftbuild.
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_TEST_BUILD_TARGETS: CompilerCoreTests
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@v7
      - name: Prepare self-hosted runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Setup SwiftPM build cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: ${{ env.KSWIFTK_CI_FAST_BUILD == '1' && 'fast' || 'default' }}
          save: ${{ github.event_name != 'pull_request' && matrix.shard_index == 0 && 'true' || 'false' }}
      - name: Configure CompilerCore test parallelism
        run: |
          worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          {
            echo "SWIFT_TEST_BUILD_JOBS=$worker_count"
            echo "SWIFT_TEST_WORKERS=$worker_count"
            echo "SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=$worker_count"
          } >> "$GITHUB_ENV"
          echo "CompilerCore parallelization width: $worker_count"
      - name: Build compiler and tests
        run: bash Scripts/build_swift_tests.sh -j "$SWIFT_TEST_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      - name: Run smoke tests with strict concurrency warnings
        if: matrix.shard_index == 0
        env:
          SWIFT_TEST_PARALLEL: "1"
        run: bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS
      - name: Run CompilerCoreTests shard with strict concurrency warnings
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode static --tests-dir Tests/CompilerCoreTests --target-prefix CompilerCoreTests \
            --shard-index "${{ matrix.shard_index }}" --shard-count 3 \
            -- $SWIFT_XSWIFTC_FLAGS --skip '^CompilerCoreTests\.(FrontendParallelBenchmarkTests|SmokeTests)/'
      - name: Run CompilerCore frontend benchmarks separately
        if: matrix.shard_index == 0
        env:
          SWIFT_TEST_PARALLEL: "0"
        run: |
          bash Scripts/swift_test.sh --skip-build --filter '^CompilerCoreTests\.FrontendParallelBenchmarkTests/' \
            $SWIFT_XSWIFTC_FLAGS
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo "## Verification 1/5 reproduce (shard ${{ matrix.shard_label }}/3)"
            echo '```bash'
            echo "worker_count=\"\$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)\""
            echo "KSWIFTK_CI_FAST_BUILD=1 SWIFT_BUILD_SYSTEM=native SWIFT_ENABLE_COMPILE_CACHE=1 SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/build_swift_tests.sh -j \"\$worker_count\" $SWIFT_XSWIFTC_FLAGS"
            if [[ "${{ matrix.shard_index }}" == "0" ]]; then
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=1 SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS"
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=0 SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^CompilerCoreTests\\.FrontendParallelBenchmarkTests/' $SWIFT_XSWIFTC_FLAGS"
            fi
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=\"\$worker_count\" bash Scripts/shard_swift_tests.sh --mode static --tests-dir Tests/CompilerCoreTests --target-prefix CompilerCoreTests --shard-index ${{ matrix.shard_index }} --shard-count 3 -- $SWIFT_XSWIFTC_FLAGS --skip '^CompilerCoreTests\\.(FrontendParallelBenchmarkTests|SmokeTests)/'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep release compiler validation on an independent lane so it does not
  # extend the longest CompilerCore shard's critical path.
  verify-core-e2e:
    name: Verification 1/5 (release compiler E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/out/ModuleCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@v7
      - name: Prepare self-hosted runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Setup release SwiftPM build cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: release-e2e
          save: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      - name: Configure release build parallelism
        run: |
          worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          echo "SWIFT_BUILD_JOBS=$worker_count" >> "$GITHUB_ENV"
          echo "Release build parallelization width: $worker_count"
      - name: Build release kswiftc
        run: |
          swift build -debug-info-format none -c release --product kswiftc \
            -j "$SWIFT_BUILD_JOBS"
      - name: Run minimal end-to-end compiler test
        run: |
          kswiftc_bin="$(swift build -c release --product kswiftc --show-bin-path)/kswiftc"
          "$kswiftc_bin" Scripts/diff_cases/hello.kt -o /tmp/swiftbuild_hello
          /tmp/swiftbuild_hello
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo '## Verification 1/5 release E2E reproduce'
            echo '```bash'
            echo 'worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"'
            echo 'swift build -debug-info-format none -c release --product kswiftc -j "\$worker_count"'
            echo 'KSWIFTC="$(swift build -c release --product kswiftc --show-bin-path)/kswiftc"; "$KSWIFTC" Scripts/diff_cases/hello.kt -o /tmp/swiftbuild_hello && /tmp/swiftbuild_hello'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-self-hosted:
    name: Verification 2-4/5 (Backend, Runtime, CLI, LSP, and Repository Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      # The compilation cache (cache-compile-job) CAS path, used by the legacy
      # native build system as well as swiftbuild.
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_TEST_BUILD_TARGETS: CompilerBackendTests RuntimeTests RuntimeTestsParallel KSwiftKCLITests LSPServerTests
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@v7
      - name: Prepare self-hosted runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
      - name: Show toolchain versions
        run: swift --version
      - name: Setup SwiftPM build cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: ${{ env.KSWIFTK_CI_FAST_BUILD == '1' && 'fast' || 'default' }}
          save: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      - name: Configure backend test parallelism
        run: |
          worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          {
            echo "SWIFT_TEST_BUILD_JOBS=$worker_count"
            echo "SWIFT_TEST_WORKERS=$worker_count"
            echo "SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=$worker_count"
          } >> "$GITHUB_ENV"
          echo "Backend parallelization width: $worker_count"
      - name: Build compiler and tests
        run: bash Scripts/build_swift_tests.sh -j "$SWIFT_TEST_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      # With one shared lane there is no need to list every concrete XCTest
      # method for cross-job sharding. Suite-level static filters also ensure
      # test-discovery failures cannot be mistaken for an empty test set.
      - name: Run CompilerBackendTests with strict concurrency warnings
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode static --tests-dir Tests/CompilerBackendTests --target-prefix CompilerBackendTests \
            -- $SWIFT_XSWIFTC_FLAGS
      - name: Run RuntimeTests (serialized, chunked) with strict concurrency warnings
        env:
          SWIFT_TEST_PARALLEL: "0"
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode static --tests-dir Tests/RuntimeTests --target-prefix RuntimeTests \
            -- $SWIFT_XSWIFTC_FLAGS
      # native SwiftPM produces a single PackageTests bundle; --test-product
      # (SWIFT_TEST_PRODUCT) is only valid with SWIFT_BUILD_SYSTEM=swiftbuild.
      # shard_swift_tests.sh already gates SWIFT_TEST_PRODUCT the same way.
      - name: Run RuntimeTestsParallel with strict concurrency warnings
        env:
          SWIFT_TEST_PARALLEL: "1"
        run: bash Scripts/swift_test.sh --skip-build --filter '^RuntimeTestsParallel\.' $SWIFT_XSWIFTC_FLAGS
      - name: Run KSwiftKCLITests with strict concurrency warnings
        env:
          SWIFT_TEST_PARALLEL: "1"
        run: bash Scripts/swift_test.sh --skip-build --filter '^KSwiftKCLITests\.' $SWIFT_XSWIFTC_FLAGS
      - name: Run LSPServerTests with strict concurrency warnings
        env:
          SWIFT_TEST_PARALLEL: "1"
        run: bash Scripts/swift_test.sh --skip-build --filter '^LSPServerTests\.' $SWIFT_XSWIFTC_FLAGS
      - name: Generate loc report
        run: |
          mkdir -p "$RUNNER_TEMP/refactoring-metrics"
          bash Scripts/loc_report.sh | tee "$RUNNER_TEMP/refactoring-metrics/loc_report.tsv"
      - name: Summarize loc report
        run: |
          {
            echo '## Refactoring metrics'
            echo
            echo '```tsv'
            cat "$RUNNER_TEMP/refactoring-metrics/loc_report.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload loc report artifact
        uses: actions/upload-artifact@v7
        with:
          name: refactoring-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/refactoring-metrics/loc_report.tsv
          if-no-files-found: error
          retention-days: 30
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install jscpd
        run: |
          jscpd_prefix="$RUNNER_TEMP/jscpd"
          for attempt in 1 2 3; do
            if npm install --prefix "$jscpd_prefix" --no-save jscpd@4.0.8; then
              echo "$jscpd_prefix/node_modules/.bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "npm install failed after 3 attempts" >&2
          exit 1
      - name: Run jscpd
        run: jscpd --threshold 5.6 --min-lines 15 --format swift Sources/
      - name: Observe jscpd report (Sources and Tests)
        run: |
          report_dir="$(mktemp -d)"
          jscpd --config .jscpd.json --silent --reporters json --output "$report_dir" --exitCode 0
          node - "$report_dir/jscpd-report.json" <<'NODE'
          const fs = require("fs");
          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const total = report.statistics.total;
          const lines = [
            "## jscpd observed duplication (Sources + Tests)",
            "",
            "| Metric | Value |",
            "|---|---:|",
            `| Files | ${total.sources} |`,
            `| Lines | ${total.lines} |`,
            `| Clones | ${total.clones} |`,
            `| Duplicated lines | ${total.duplicatedLines} |`,
            `| Duplicated line % | ${total.percentage}% |`,
            `| Duplicated tokens | ${total.duplicatedTokens} |`,
            `| Duplicated token % | ${total.percentageTokens}% |`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          console.log(
            `jscpd observed duplication: ${total.clones} clones, ${total.duplicatedLines} duplicated lines (${total.percentage}%)`
          );
          NODE
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo '## Verification 2-4/5 reproduce'
            echo '```bash'
            echo "worker_count=\"\$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)\""
            echo 'KSWIFTK_CI_FAST_BUILD=1 SWIFT_BUILD_SYSTEM=native SWIFT_ENABLE_COMPILE_CACHE=1 bash Scripts/build_swift_tests.sh -j "$worker_count" $SWIFT_XSWIFTC_FLAGS'
            echo 'SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS="$worker_count" SWIFT_TEST_BUILD_JOBS="$worker_count" bash Scripts/shard_swift_tests.sh --mode static --tests-dir Tests/CompilerBackendTests --target-prefix CompilerBackendTests -- $SWIFT_XSWIFTC_FLAGS'
            echo 'SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=0 SWIFT_TEST_BUILD_JOBS="$worker_count" bash Scripts/shard_swift_tests.sh --mode static --tests-dir Tests/RuntimeTests --target-prefix RuntimeTests -- $SWIFT_XSWIFTC_FLAGS'
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=1 SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^RuntimeTestsParallel\\.' $SWIFT_XSWIFTC_FLAGS"
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=1 SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^KSwiftKCLITests\\.' $SWIFT_XSWIFTC_FLAGS"
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_PARALLEL=1 SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^LSPServerTests\\.' $SWIFT_XSWIFTC_FLAGS"
            echo "npm install --prefix \"\$RUNNER_TEMP/jscpd\" --no-save jscpd@4.0.8"
            echo 'jscpd --threshold 5.6 --min-lines 15 --format swift Sources/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-diff:
    name: Verification 5/5 (kotlinc Diff, shard ${{ matrix.shard_label }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
    env:
      KOTLIN_VERSION: "2.3.10"
      KOTLINX_COROUTINES_VERSION: "1.10.2"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Build kswiftc
        env:
          SWIFT_BUILD_JOBS: "4"
        run: swift build -c release --product kswiftc -j "$SWIFT_BUILD_JOBS" -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Cache Kotlin compiler and coroutines jar
        id: cache-kotlin
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}
      - name: Cache kotlinc reference jars
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/kotlinc-ref-cache
          key: kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}-shard-${{ matrix.shard_index }}-${{ hashFiles('Scripts/diff_cases/**/*.kt') }}
          restore-keys: |
            kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}-shard-${{ matrix.shard_index }}-
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          TOOLS_DIR="${RUNNER_TEMP}/kotlin-tools"
          KOTLIN_DIR="${TOOLS_DIR}/kotlin"
          mkdir -p "$KOTLIN_DIR"

          if [ ! -f "${KOTLIN_DIR}/kotlinc/bin/kotlinc" ]; then
            curl -fSL -o "${TOOLS_DIR}/kotlin-compiler.zip" \
              "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
            unzip -q "${TOOLS_DIR}/kotlin-compiler.zip" -d "$KOTLIN_DIR"
          fi
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify prerequisites
        run: |
          java -version
          kotlinc -version
      - name: Run kotlinc diff regression cases
        id: diff_kotlinc
        continue-on-error: true
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_report.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_kotlinc_artifacts
          DIFF_COMPILE_TIMEOUT: "180"
          DIFF_RUN_TIMEOUT: "30"
          DIFF_LOG_PASS: "0"
          KOTLINC_REF_CACHE_DIR: ${{ runner.temp }}/kotlinc-ref-cache
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
          KSWIFTC: ${{ github.workspace }}/.build/release/kswiftc
        run: |
          DIFF_WORKERS="$(nproc)" \
            bash Scripts/diff_kotlinc.sh \
              --shard-index "${{ matrix.shard_index }}" --shard-count 2 \
              --report "$DIFF_REPORT" Scripts/diff_cases
      - name: Summarize kotlinc diff artifacts
        if: always() && steps.diff_kotlinc.outcome != 'cancelled'
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_report.tsv
        run: bash Scripts/diff_kotlinc_ci_summary.sh --report "$DIFF_REPORT"
      - name: Fail when kotlinc diff regression mismatches exist
        if: steps.diff_kotlinc.outcome == 'failure'
        run: |
          echo "kotlinc diff regression cases failed." >&2
          exit 1
      - name: Upload kotlinc diff failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlinc-diff-regression-${{ github.run_id }}-shard-${{ matrix.shard_label }}
          path: |
            ${{ runner.temp }}/diff_kotlinc_report.tsv
            ${{ runner.temp }}/diff_kotlinc_artifacts
          if-no-files-found: ignore
          retention-days: 30

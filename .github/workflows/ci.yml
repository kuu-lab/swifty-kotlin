name: CI

# Minimal gate for pull requests and the merge queue: repository checks, a
# debug build of the compiler and every test target under strict concurrency,
# and SmokeTests. The full verification suite (all test targets and the
# kotlinc diff corpus at -O0/-O2) runs once every morning in
# nightly-full.yml.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A/B measurements showed that compiling CompilerCore with -O in debug builds
  # reduces the longest CompilerCore shards while preserving test coverage.
  KSWIFTK_OPTIMIZE_COMPILER_CORE: "1"

# Successive pushes to the same PR cancel all in-flight verification jobs.
# Non-PR events get a unique group per run and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify remote Action pins
        run: python3 Scripts/check_action_pins.py
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Check for duplicate TODO task IDs
        run: bash Scripts/check_todo_ids.sh
      - name: Check mutation fuzzer keyword set matches lexer
        run: bash Scripts/check_mutation_fuzzer_keywords.sh
      - name: Check Swift test parallelism overrides
        run: bash Scripts/test_swift_test_parallelism.sh
      - name: Check workflows install npm tools via npm ci only
        run: bash Scripts/check_workflow_npm_install.sh
      - name: Verify Kotlin compiler archive integrity policy
        run: bash Scripts/test_verify_kotlin_compiler_archive.sh
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install jscpd
        run: |
          jscpd_prefix="$RUNNER_TEMP/jscpd"
          mkdir -p "$jscpd_prefix"
          cp .github/ci-tools/package.json .github/ci-tools/package-lock.json .github/ci-tools/.npmrc "$jscpd_prefix/"
          for attempt in 1 2 3; do
            if npm ci --prefix "$jscpd_prefix" --ignore-scripts; then
              echo "$jscpd_prefix/node_modules/.bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1
      - name: Run jscpd
        run: |
          report_dir="$(mktemp -d)"
          set +e
          jscpd --config .jscpd-ci.json --output "$report_dir"
          jscpd_exit=$?
          set -e
          if [ -f "$report_dir/jscpd-report.json" ]; then
          node - "$report_dir/jscpd-report.json" <<'NODE'
          const fs = require("fs");
          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const total = report.statistics.total;
          const lines = [
            "## jscpd observed duplication (Sources)",
            "",
            "| Metric | Value |",
            "|---|---:|",
            `| Files | ${total.sources} |`,
            `| Lines | ${total.lines} |`,
            `| Clones | ${total.clones} |`,
            `| Duplicated lines | ${total.duplicatedLines} |`,
            `| Duplicated line % | ${total.percentage}% |`,
            `| Duplicated tokens | ${total.duplicatedTokens} |`,
            `| Duplicated token % | ${total.percentageTokens}% |`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          console.log(
            `jscpd observed duplication: ${total.clones} clones, ${total.duplicatedLines} duplicated lines (${total.percentage}%)`
          );
          NODE
          fi
          exit $jscpd_exit

  build-and-smoke:
    name: Build all targets and run SmokeTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Setup SwiftPM build cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: fast
          save: "false"
      - name: Configure build parallelism
        run: |
          worker_count="$(nproc)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          echo "SWIFT_TEST_BUILD_JOBS=$worker_count" >> "$GITHUB_ENV"
          echo "Detected $worker_count logical CPUs"
      - name: Build compiler and all tests
        run: bash Scripts/build_swift_tests.sh -j "$SWIFT_TEST_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      - name: Run smoke tests with strict concurrency warnings
        run: |
          worker_count="$(nproc)"
          SWIFT_TEST_WORKERS="$worker_count" SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH="$worker_count" \
            bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo '## Reproduce'
            echo '```bash'
            echo 'worker_count="$(nproc)"'
            echo "KSWIFTK_CI_FAST_BUILD=1 SWIFT_BUILD_SYSTEM=native SWIFT_ENABLE_COMPILE_CACHE=1 bash Scripts/build_swift_tests.sh -j \"\$worker_count\" $SWIFT_XSWIFTC_FLAGS"
            echo "SWIFT_BUILD_SYSTEM=native bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS"
            echo '```'
            echo
            echo 'Full verification runs every morning in `nightly-full.yml`; trigger it with workflow_dispatch on this branch to run it before merging.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Single required status check for the master ruleset. Adding or removing
  # jobs above only requires updating this job's `needs`, not the ruleset.
  ci-gate:
    name: CI gate
    needs: [repository-checks, build-and-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job concluded: $result" >&2
              exit 1
            fi
          done

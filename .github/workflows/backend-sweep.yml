name: Backend diff sweep

# Manual harvest workflow: runs the kotlinc diff corpus through the jvm and
# wasm candidate backends with DIFF_BACKEND_SWEEP=1, ignoring the
# // DIFF_<BACKEND> opt-in markers so every non-candidate case executes.
# Uploads per-shard report TSVs that Scripts/diff_mark_backend_cases.sh turns
# into backend-lane markers. Dispatch on a branch to sweep that ref:
#   gh workflow run backend-sweep.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KOTLIN_VERSION: "2.4.20"
  KOTLIN_COMPILER_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kswiftc:
    name: Build release kswiftc once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Setup release SwiftPM cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: release-kswiftc
          save: "false"
      - name: Build release kswiftc
        env:
          SWIFT_BUILD_JOBS: "4"
          SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
        run: swift build -c release --product kswiftc -j "$SWIFT_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      - name: Package release compiler and resources
        run: |
          archive_name="kswiftc-release.tar.zst"
          archive_path="$RUNNER_TEMP/$archive_name"
          release_bin_dir="$(swift build -c release --show-bin-path)"
          test -x "$release_bin_dir/kswiftc"
          tar -I 'zstd -T0 -1' -cf "$archive_path" -C "$release_bin_dir" .
          (
            cd "$RUNNER_TEMP"
            sha256sum "$archive_name" > "$archive_name.sha256"
          )
      - name: Upload release compiler artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kswiftc-release.tar.zst
            ${{ runner.temp }}/kswiftc-release.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  sweep-jvm:
    name: JVM backend sweep shard ${{ matrix.shard_label }}/4
    needs: build-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Cache pinned Kotlin compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/kotlin-compiler-cache/kotlin-compiler-${{ env.KOTLIN_VERSION }}.zip
            ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-${{ env.KOTLIN_COMPILER_SHA256 }}
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          CACHE_DIR="${RUNNER_TEMP}/kotlin-compiler-cache"
          KOTLIN_DIR="${RUNNER_TEMP}/kotlin-${KOTLIN_VERSION}"
          zip_path="${CACHE_DIR}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          mkdir -p "$CACHE_DIR"

          if [ ! -s "$zip_path" ]; then
            for attempt in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
                -o "$zip_path" \
                "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"; then
                break
              fi
              echo "Kotlin compiler download attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
              rm -f "$zip_path"
              sleep $((attempt * 10))
            done
            if [ ! -s "$zip_path" ]; then
              echo "Failed to download Kotlin compiler after 5 attempts" >&2
              exit 1
            fi
          fi
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$zip_path" "$KOTLIN_COMPILER_SHA256" "$KOTLIN_DIR" "$KOTLIN_VERSION"
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build and statically validate the JVM stdlib jar
        run: |
          mkdir -p "$RUNNER_TEMP/jvm-stdlib"
          "$KSWIFTC" --stdlib-only --emit jar -o "$RUNNER_TEMP/jvm-stdlib/kswiftk-stdlib.jar"
          python3 Scripts/validate_jvm_stdlib.py "$RUNNER_TEMP/jvm-stdlib/kswiftk-stdlib.jar"
      - name: Run JVM backend sweep shard
        env:
          DIFF_BACKEND: jvm
          DIFF_BACKEND_SWEEP: "1"
          DIFF_JVM_STDLIB_JAR: ${{ runner.temp }}/jvm-stdlib/kswiftk-stdlib.jar
          DIFF_REPORT: ${{ runner.temp }}/diff_sweep_jvm_shard${{ matrix.shard_index }}.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_sweep_jvm_artifacts_shard${{ matrix.shard_index }}
          DIFF_COMPILE_TIMEOUT: "300"
          DIFF_RUN_TIMEOUT: "30"
          DIFF_LOG_PASS: "0"
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
        run: |
          # Sweep results are expected to contain failures; never gate the job.
          DIFF_WORKERS="$(nproc)" \
            bash Scripts/diff_kotlinc.sh \
              --shard-index "${{ matrix.shard_index }}" --shard-count 4 \
              --report "$DIFF_REPORT" Scripts/diff_cases || true
      - name: Upload JVM sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sweep-jvm-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diff_sweep_jvm_shard${{ matrix.shard_index }}.tsv
          if-no-files-found: warn
          retention-days: 30

  sweep-wasm:
    name: WASM backend sweep shard ${{ matrix.shard_label }}/8 (node)
    needs: build-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5
          - shard_index: 5
            shard_label: 6
          - shard_index: 6
            shard_label: 7
          - shard_index: 7
            shard_label: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Cache pinned Kotlin compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/kotlin-compiler-cache/kotlin-compiler-${{ env.KOTLIN_VERSION }}.zip
            ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-${{ env.KOTLIN_COMPILER_SHA256 }}
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          CACHE_DIR="${RUNNER_TEMP}/kotlin-compiler-cache"
          KOTLIN_DIR="${RUNNER_TEMP}/kotlin-${KOTLIN_VERSION}"
          zip_path="${CACHE_DIR}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          mkdir -p "$CACHE_DIR"

          if [ ! -s "$zip_path" ]; then
            for attempt in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
                -o "$zip_path" \
                "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"; then
                break
              fi
              echo "Kotlin compiler download attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
              rm -f "$zip_path"
              sleep $((attempt * 10))
            done
            if [ ! -s "$zip_path" ]; then
              echo "Failed to download Kotlin compiler after 5 attempts" >&2
              exit 1
            fi
          fi
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$zip_path" "$KOTLIN_COMPILER_SHA256" "$KOTLIN_DIR" "$KOTLIN_VERSION"
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Run WASM backend sweep shard (node engine)
        env:
          DIFF_BACKEND: wasm
          DIFF_BACKEND_SWEEP: "1"
          DIFF_ENGINE: node
          DIFF_REPORT: ${{ runner.temp }}/diff_sweep_wasm_shard${{ matrix.shard_index }}.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_sweep_wasm_artifacts_shard${{ matrix.shard_index }}
          DIFF_COMPILE_TIMEOUT: "600"
          DIFF_RUN_TIMEOUT: "60"
          DIFF_LOG_PASS: "0"
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
        run: |
          # Sweep results are expected to contain failures; never gate the job.
          DIFF_WORKERS="4" \
            bash Scripts/diff_kotlinc.sh \
              --shard-index "${{ matrix.shard_index }}" --shard-count 8 \
              --report "$DIFF_REPORT" Scripts/diff_cases || true
      - name: Upload WASM sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sweep-wasm-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diff_sweep_wasm_shard${{ matrix.shard_index }}.tsv
          if-no-files-found: warn
          retention-days: 30

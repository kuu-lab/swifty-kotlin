name: Nightly Full Verification

# Nightly batch, run once every morning (04:00 JST) against master.
# Pull requests and the merge queue only run the minimal gate in ci.yml
# (repository checks + debug build of every target + SmokeTests); every other
# batch job is consolidated here: CompilerCore/Backend/Runtime/CLI/LSP tests,
# the kotlinc diff corpus at -O0 and -O2 plus its JVM/WASM backend lanes,
# JS annotation evidence, the bounded mutation fuzzer with crash corpus
# replay, dead-code/fiction audits, and the kotlinx-io upstream reference and
# Apple candidate lanes. Use workflow_dispatch with a branch ref to run the
# full suite against a pull request before merging.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A/B measurements showed that compiling CompilerCore with -O in debug builds
  # reduces the longest CompilerCore shards while preserving test coverage.
  KSWIFTK_OPTIMIZE_COMPILER_CORE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-tests:
    name: Build debug Swift test bundle once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bundle: ${{ steps.package.outputs.bundle }}
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Setup SwiftPM build cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: fast
          save: "false"
      - name: Configure build parallelism
        run: |
          worker_count="$(nproc)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          echo "SWIFT_TEST_BUILD_JOBS=$worker_count" >> "$GITHUB_ENV"
          echo "Detected $worker_count logical CPUs"
      - name: Build compiler and all tests
        id: build
        run: bash Scripts/build_swift_tests.sh -j "$SWIFT_TEST_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      - name: Warm runtime objects for candidate-only verification
        env:
          DIFF_COMPILE_TIMEOUT: "600"
          DIFF_KSWIFTC_FLAGS: "--no-incremental"
        run: bash Scripts/run_candidate_only.sh Scripts/diff_cases/array_max_by.kt
      - name: Verify candidate-only diff cases
        env:
          DIFF_KSWIFTC_FLAGS: "--no-incremental"
        run: bash Scripts/run_candidate_only.sh Scripts/diff_cases
      - name: Package debug test bundle
        id: package
        if: always() && steps.build.outcome == 'success'
        run: |
          archive_name="swift-debug-tests.tar.zst"
          archive_path="$RUNNER_TEMP/$archive_name"
          tar -I 'zstd -T0 -1'             --exclude='.build/out/CompilationCache.noindex'             -cf "$archive_path" .build
          archive_size="$(du -h "$archive_path" | cut -f1)"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$archive_name" > "$archive_name.sha256"
          )
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=2             "$archive_path" "$RUNNER_TEMP/$archive_name.part-"
          part_count="$(find "$RUNNER_TEMP" -maxdepth 1 -name "$archive_name.part-*" -type f | wc -l)"
          rm "$archive_path"
          {
            echo "## Debug test bundle artifact"
            echo
            echo "- Compressed size: \`$archive_size\`"
            echo "- Upload parts: \`$part_count\`"
            echo "- Compilation CAS excluded: \`$SWIFT_CAS_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bundle=ready" >> "$GITHUB_OUTPUT"
      - name: Upload debug test bundle artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-debug-tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/swift-debug-tests.tar.zst.part-*
            ${{ runner.temp }}/swift-debug-tests.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-core:
    name: Verification 1/5 (CompilerCore and Smoke, shard ${{ matrix.shard_label }}/6)
    needs: build-debug-tests
    if: always() && needs.build-debug-tests.outputs.bundle == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
          - shard_index: 4
            shard_label: 5
          - shard_index: 5
            shard_label: 6
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Download debug test bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-debug-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/swift-debug-tests-artifact
      - name: Verify and extract debug test bundle
        run: |
          artifact_dir="$RUNNER_TEMP/swift-debug-tests-artifact"
          archive_path="$RUNNER_TEMP/swift-debug-tests.tar.zst"
          cat "$artifact_dir"/swift-debug-tests.tar.zst.part-* > "$archive_path"
          (
            cd "$RUNNER_TEMP"
            cp "$artifact_dir/swift-debug-tests.tar.zst.sha256" .
            sha256sum --check swift-debug-tests.tar.zst.sha256
          )
          rm -rf .build
          tar -I zstd -xf "$archive_path" -C "$GITHUB_WORKSPACE"
          test -d .build
          mkdir -p "$SWIFT_CAS_PATH"
      - name: Configure CompilerCore test parallelism
        run: |
          worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          {
            echo "SWIFT_TEST_BUILD_JOBS=$worker_count"
            echo "SWIFT_TEST_WORKERS=$worker_count"
            echo "SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=$worker_count"
          } >> "$GITHUB_ENV"
          echo "CompilerCore parallelization width: $worker_count"
      - name: Run smoke tests with strict concurrency warnings
        if: matrix.shard_index == 0
        run: bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS
      - name: Run CompilerCoreTests method shard with strict concurrency warnings
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode dynamic --list-filter '^CompilerCoreTests\.' \
            --list-exclude '^CompilerCoreTests\.(FrontendParallelBenchmarkTests|GoldenDiagnosticsGoldenTests|GoldenHarnessInventoryTests|GoldenLexerGoldenTests|GoldenParserGoldenTests|GoldenSemaGoldenTests|SmokeTests)/' \
            --target-prefix CompilerCoreTests \
            --shard-index "${{ matrix.shard_index }}" --shard-count 6 \
            -- $SWIFT_XSWIFTC_FLAGS
      - name: Run GoldenHarness full inventory gate
        if: matrix.shard_index == 0
        run: |
          bash Scripts/swift_test.sh --skip-build --no-parallel \
            --filter '^CompilerCoreTests\.GoldenHarnessInventoryTests/' \
            $SWIFT_XSWIFTC_FLAGS
      - name: Run CompilerCore golden batch shard
        env:
          KSWIFTK_GOLDEN_SHARD_INDEX: ${{ matrix.shard_index }}
          KSWIFTK_GOLDEN_SHARD_COUNT: 6
        run: |
          bash Scripts/swift_test.sh --skip-build \
            --filter '^CompilerCoreTests\.Golden(Diagnostics|Lexer|Parser|Sema)GoldenTests/' \
            $SWIFT_XSWIFTC_FLAGS
      - name: Run CompilerCore frontend benchmarks separately
        if: matrix.shard_index == 0
        run: |
          bash Scripts/swift_test.sh --skip-build --no-parallel \
            --filter '^CompilerCoreTests\.FrontendParallelBenchmarkTests/' \
            $SWIFT_XSWIFTC_FLAGS
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo "## Verification 1/5 reproduce (shard ${{ matrix.shard_label }}/6)"
            echo '```bash'
            echo "worker_count=\"\$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)\""
            echo "KSWIFTK_CI_FAST_BUILD=1 SWIFT_BUILD_SYSTEM=native SWIFT_ENABLE_COMPILE_CACHE=1 SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/build_swift_tests.sh -j \"\$worker_count\" $SWIFT_XSWIFTC_FLAGS"
            if [[ "${{ matrix.shard_index }}" == "0" ]]; then
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter SmokeTests $SWIFT_XSWIFTC_FLAGS"
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --no-parallel --filter '^CompilerCoreTests\\.FrontendParallelBenchmarkTests/' $SWIFT_XSWIFTC_FLAGS"
            fi
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=\"\$worker_count\" bash Scripts/shard_swift_tests.sh --mode dynamic --list-filter '^CompilerCoreTests\\.' --list-exclude '^CompilerCoreTests\\.(FrontendParallelBenchmarkTests|GoldenDiagnosticsGoldenTests|GoldenHarnessInventoryTests|GoldenLexerGoldenTests|GoldenParserGoldenTests|GoldenSemaGoldenTests|SmokeTests)/' --target-prefix CompilerCoreTests --shard-index ${{ matrix.shard_index }} --shard-count 6 -- $SWIFT_XSWIFTC_FLAGS"
            if [[ "${{ matrix.shard_index }}" == "0" ]]; then
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --no-parallel --filter '^CompilerCoreTests\\.GoldenHarnessInventoryTests/' $SWIFT_XSWIFTC_FLAGS"
            fi
            echo "KSWIFTK_GOLDEN_SHARD_INDEX=${{ matrix.shard_index }} KSWIFTK_GOLDEN_SHARD_COUNT=6 SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^CompilerCoreTests\\.Golden(Diagnostics|Lexer|Parser|Sema)GoldenTests/' $SWIFT_XSWIFTC_FLAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-self-hosted:
    name: Verification 2-3/5 (Backend, Runtime, CLI, and LSP, shard ${{ matrix.shard_label }}/4)
    needs: build-debug-tests
    if: always() && needs.build-debug-tests.outputs.bundle == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
          - shard_index: 1
            shard_label: 2
          - shard_index: 2
            shard_label: 3
          - shard_index: 3
            shard_label: 4
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
      - name: Show toolchain versions
        run: swift --version
      - name: Download debug test bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-debug-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/swift-debug-tests-artifact
      - name: Verify and extract debug test bundle
        run: |
          artifact_dir="$RUNNER_TEMP/swift-debug-tests-artifact"
          archive_path="$RUNNER_TEMP/swift-debug-tests.tar.zst"
          cat "$artifact_dir"/swift-debug-tests.tar.zst.part-* > "$archive_path"
          (
            cd "$RUNNER_TEMP"
            cp "$artifact_dir/swift-debug-tests.tar.zst.sha256" .
            sha256sum --check swift-debug-tests.tar.zst.sha256
          )
          rm -rf .build
          tar -I zstd -xf "$archive_path" -C "$GITHUB_WORKSPACE"
          test -d .build
          mkdir -p "$SWIFT_CAS_PATH"
      - name: Configure backend test parallelism
        run: |
          worker_count="$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          if ! [[ "$worker_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "Unable to detect a positive logical CPU count: $worker_count" >&2
            exit 1
          fi
          {
            echo "SWIFT_TEST_BUILD_JOBS=$worker_count"
            echo "SWIFT_TEST_WORKERS=$worker_count"
            echo "SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=$worker_count"
          } >> "$GITHUB_ENV"
          echo "Backend parallelization width: $worker_count"
      - name: Setup Java for JVM backend tests
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin for JVM interoperability tests
        env:
          KOTLIN_VERSION: "2.4.20"
          KOTLIN_COMPILER_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
        run: |
          archive="$RUNNER_TEMP/jvm-kotlin-compiler.zip"
          destination="$RUNNER_TEMP/jvm-kotlin"
          curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
            -o "$archive" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$archive" "$KOTLIN_COMPILER_SHA256" "$destination" "$KOTLIN_VERSION"
          echo "$destination/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run CompilerBackendTests shard with strict concurrency warnings
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode static --tests-dir Tests/CompilerBackendTests --target-prefix CompilerBackendTests \
            --shard-index "${{ matrix.shard_index }}" --shard-count 4 \
            -- $SWIFT_XSWIFTC_FLAGS
      - name: Run RuntimeTests (serialized, chunked) with strict concurrency warnings
        if: matrix.shard_index == 0
        run: |
          bash Scripts/shard_swift_tests.sh \
            --mode static --tests-dir Tests/RuntimeTests --target-prefix RuntimeTests \
            -- --no-parallel $SWIFT_XSWIFTC_FLAGS
      - name: Run RuntimeTestsParallel with strict concurrency warnings
        if: matrix.shard_index == 0
        run: bash Scripts/swift_test.sh --skip-build --filter '^RuntimeTestsParallel\.' $SWIFT_XSWIFTC_FLAGS
      - name: Run KSwiftKCLITests with strict concurrency warnings
        if: matrix.shard_index == 0
        run: bash Scripts/swift_test.sh --skip-build --filter '^KSwiftKCLITests\.' $SWIFT_XSWIFTC_FLAGS
      - name: Run LSPServerTests with strict concurrency warnings
        if: matrix.shard_index == 0
        run: bash Scripts/swift_test.sh --skip-build --filter '^LSPServerTests\.' $SWIFT_XSWIFTC_FLAGS
      - name: Reproduce hints
        if: always()
        run: |
          {
            echo "## Verification 2-3/5 reproduce (shard ${{ matrix.shard_label }}/4)"
            echo '```bash'
            echo "worker_count=\"\$(sysctl -n hw.logicalcpu 2>/dev/null || getconf _NPROCESSORS_ONLN)\""
            echo 'KSWIFTK_CI_FAST_BUILD=1 SWIFT_BUILD_SYSTEM=native SWIFT_ENABLE_COMPILE_CACHE=1 bash Scripts/build_swift_tests.sh -j "$worker_count" $SWIFT_XSWIFTC_FLAGS'
            echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/shard_swift_tests.sh --mode static --tests-dir Tests/CompilerBackendTests --target-prefix CompilerBackendTests --shard-index ${{ matrix.shard_index }} --shard-count 4 -- $SWIFT_XSWIFTC_FLAGS"
            if [[ "${{ matrix.shard_index }}" == "0" ]]; then
              echo 'SWIFT_BUILD_SYSTEM=native SWIFT_TEST_BUILD_JOBS="$worker_count" bash Scripts/shard_swift_tests.sh --mode static --tests-dir Tests/RuntimeTests --target-prefix RuntimeTests -- --no-parallel $SWIFT_XSWIFTC_FLAGS'
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^RuntimeTestsParallel\\.' $SWIFT_XSWIFTC_FLAGS"
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^KSwiftKCLITests\\.' $SWIFT_XSWIFTC_FLAGS"
              echo "SWIFT_BUILD_SYSTEM=native SWIFT_TEST_WORKERS=\"\$worker_count\" SWIFT_TEST_BUILD_JOBS=\"\$worker_count\" bash Scripts/swift_test.sh --skip-build --filter '^LSPServerTests\\.' $SWIFT_XSWIFTC_FLAGS"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  refactoring-metrics:
    name: Refactoring metrics (loc report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate loc report
        run: |
          mkdir -p "$RUNNER_TEMP/refactoring-metrics"
          bash Scripts/loc_report.sh | tee "$RUNNER_TEMP/refactoring-metrics/loc_report.tsv"
      - name: Summarize loc report
        run: |
          {
            echo '## Refactoring metrics'
            echo
            echo '```tsv'
            cat "$RUNNER_TEMP/refactoring-metrics/loc_report.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload loc report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refactoring-metrics-${{ github.run_id }}
          path: ${{ runner.temp }}/refactoring-metrics/loc_report.tsv
          if-no-files-found: error

  build-release-kswiftc:
    name: Build release kswiftc once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Setup release SwiftPM cache
        uses: ./.github/actions/setup-swiftpm-cache
        with:
          swift-version: "6.3"
          build-variant: release-kswiftc
          save: "false"
      - name: Build release kswiftc
        env:
          SWIFT_BUILD_JOBS: "4"
          SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
        run: swift build -c release --product kswiftc -j "$SWIFT_BUILD_JOBS" $SWIFT_XSWIFTC_FLAGS
      - name: Package release compiler and resources
        run: |
          archive_name="kswiftc-release.tar.zst"
          archive_path="$RUNNER_TEMP/$archive_name"
          release_bin_dir="$(swift build -c release --show-bin-path)"
          test -x "$release_bin_dir/kswiftc"
          tar -I 'zstd -T0 -1' -cf "$archive_path" -C "$release_bin_dir" .
          (
            cd "$RUNNER_TEMP"
            sha256sum "$archive_name" > "$archive_name.sha256"
          )
          {
            echo "## Release compiler artifact"
            echo
            echo "- Source directory: \`$release_bin_dir\`"
            echo "- Archive size: \`$(du -h "$archive_path" | cut -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release compiler artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kswiftc-release.tar.zst
            ${{ runner.temp }}/kswiftc-release.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-js-annotations:
    name: JS annotations native source/artifact O0/O2 evidence
    needs: build-release-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KOTLINC: /not-used-by-js-annotations
      JAVA_BIN: /not-used-by-js-annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/js-annotations-compiler
      - name: Verify and extract compiler
        run: |
          artifact_dir="$RUNNER_TEMP/js-annotations-compiler"
          install_dir="$RUNNER_TEMP/js-annotations-kswiftc"
          (cd "$artifact_dir" && sha256sum --check kswiftc-release.tar.zst.sha256)
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Run complete JS annotation evidence matrix
        run: |
          python3 Scripts/js_annotations/run_ci.py \
            --kswiftc "$KSWIFTC" \
            --artifact-root "$RUNNER_TEMP/js-annotations-evidence"
      - name: Publish JS annotation evidence summary
        if: always()
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/js-annotations-evidence/*/evidence.md)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo 'JS annotation evidence: not-run or interrupted; no complete summary.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JS annotation commands and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-annotations-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/js-annotations-evidence
            !${{ runner.temp }}/js-annotations-evidence/**/module-cache/**
          if-no-files-found: warn
          retention-days: 30

  verify-diff:
    name: Verification 5/5 (kotlinc Diff${{ matrix.optimization_suffix }}, shard ${{ matrix.shard_label }}/4)
    needs: build-release-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard_index: 0
            shard_label: 1
            optimization: O0
            optimization_flags: ""
            optimization_suffix: ""
          - shard_index: 1
            shard_label: 2
            optimization: O0
            optimization_flags: ""
            optimization_suffix: ""
          - shard_index: 2
            shard_label: 3
            optimization: O0
            optimization_flags: ""
            optimization_suffix: ""
          - shard_index: 3
            shard_label: 4
            optimization: O0
            optimization_flags: ""
            optimization_suffix: ""
          - shard_index: 0
            shard_label: 1
            optimization: O2
            optimization_flags: "-O2"
            optimization_suffix: " O2"
          - shard_index: 1
            shard_label: 2
            optimization: O2
            optimization_flags: "-O2"
            optimization_suffix: " O2"
          - shard_index: 2
            shard_label: 3
            optimization: O2
            optimization_flags: "-O2"
            optimization_suffix: " O2"
          - shard_index: 3
            shard_label: 4
            optimization: O2
            optimization_flags: "-O2"
            optimization_suffix: " O2"
    env:
      KOTLIN_VERSION: "2.4.20"
      KOTLIN_COMPILER_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
      KOTLINX_COROUTINES_VERSION: "1.10.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Kotlin compiler archive integrity policy
        if: matrix.shard_index == 0 && matrix.optimization == 'O0'
        run: bash Scripts/test_verify_kotlin_compiler_archive.sh
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Show toolchain versions
        run: swift --version
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Cache pinned Kotlin compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/kotlin-compiler-cache/kotlin-compiler-${{ env.KOTLIN_VERSION }}.zip
            ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-${{ env.KOTLIN_COMPILER_SHA256 }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}
      - name: Cache kotlinc reference jars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kotlinc-ref-cache
          key: kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}-shard-${{ matrix.shard_index }}-${{ hashFiles('Scripts/diff_cases/**/*.kt') }}
          restore-keys: |
            kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-coroutines-${{ env.KOTLINX_COROUTINES_VERSION }}-shard-${{ matrix.shard_index }}-
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          CACHE_DIR="${RUNNER_TEMP}/kotlin-compiler-cache"
          KOTLIN_DIR="${RUNNER_TEMP}/kotlin-${KOTLIN_VERSION}"
          zip_path="${CACHE_DIR}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          mkdir -p "$CACHE_DIR"

          if [ ! -s "$zip_path" ]; then
            for attempt in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
                -o "$zip_path" \
                "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"; then
                break
              fi
              echo "Kotlin compiler download attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
              rm -f "$zip_path"
              sleep $((attempt * 10))
            done
            if [ ! -s "$zip_path" ]; then
              echo "Failed to download Kotlin compiler after 5 attempts" >&2
              exit 1
            fi
          fi
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$zip_path" "$KOTLIN_COMPILER_SHA256" "$KOTLIN_DIR" "$KOTLIN_VERSION"
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify prerequisites
        run: |
          java -version
          kotlinc -version
          "$KSWIFTC" --version || true
      - name: Run diagnostic harness self-test
        if: matrix.shard_index == 0 && matrix.optimization == 'O0'
        run: DIFF_REQUIRE_JDK21=0 bash Scripts/diff_diagnostics.sh --self-test
      - name: Run diagnostic differential cases
        id: diff_diagnostics
        if: matrix.shard_index == 0 && matrix.optimization == 'O0'
        continue-on-error: true
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_diagnostics_report.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_diagnostics_artifacts
          DIFF_COMPILE_TIMEOUT: "180"
          DIFF_LOG_PASS: "0"
          DIFF_KSWIFTC_FLAGS: "--no-incremental"
        run: bash Scripts/diff_diagnostics.sh --report "$DIFF_REPORT" Scripts/diagnostic_cases
      - name: Run kotlinc diff regression cases
        id: diff_kotlinc
        continue-on-error: true
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_report.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_kotlinc_artifacts
          DIFF_COMPILE_TIMEOUT: "180"
          DIFF_RUN_TIMEOUT: "30"
          DIFF_LOG_PASS: "0"
          KOTLINC_REF_CACHE_DIR: ${{ runner.temp }}/kotlinc-ref-cache
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
          KSWIFTK_KIR_VERIFY: "1"
          DIFF_KSWIFTC_FLAGS: "${{ matrix.optimization_flags }} --no-incremental"
        run: |
          DIFF_WORKERS="$(nproc)" \
            bash Scripts/diff_kotlinc.sh \
              --shard-index "${{ matrix.shard_index }}" --shard-count 4 \
              --report "$DIFF_REPORT" Scripts/diff_cases
      - name: Run candidate-only Kotlin cases
        if: matrix.shard_index == 0 && matrix.optimization == 'O0'
        env:
          DIFF_KSWIFTC_FLAGS: "--no-incremental"
        run: |
          bash Scripts/run_candidate_only.sh \
            Scripts/candidate_cases/logging_basic.kt \
            Scripts/candidate_cases/support/slf4j_minimal.kt
      - name: Summarize kotlinc diff artifacts
        if: always() && steps.diff_kotlinc.outcome != 'cancelled'
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_report.tsv
        run: bash Scripts/diff_kotlinc_ci_summary.sh --report "$DIFF_REPORT"
      - name: Fail when kotlinc diff regression mismatches exist
        if: steps.diff_kotlinc.outcome == 'failure'
        run: |
          echo "kotlinc diff regression cases failed." >&2
          exit 1
      - name: Fail when diagnostic differential mismatches exist
        if: steps.diff_diagnostics.outcome == 'failure'
        run: |
          echo "Diagnostic differential cases failed." >&2
          exit 1
      - name: Upload kotlinc diff failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinc-diff-regression-${{ github.run_id }}-${{ matrix.optimization }}-shard-${{ matrix.shard_label }}
          path: |
            ${{ runner.temp }}/diff_kotlinc_report.tsv
            ${{ runner.temp }}/diff_kotlinc_artifacts
            ${{ runner.temp }}/diff_diagnostics_report.tsv
            ${{ runner.temp }}/diff_diagnostics_artifacts
          if-no-files-found: ignore
          retention-days: 30

  # JVM backend lane: the same kotlinc reference outputs are compared against
  # kswiftc --emit jar artifacts executed with `java -Xverify:all -cp` on top
  # of a shared kswiftk stdlib jar. Only cases carrying `// DIFF_JVM` run;
  # see DIFF_BACKEND in Scripts/diff_kotlinc.sh.
  verify-jvm-diff:
    name: kotlinc Diff (JVM backend)
    needs: build-release-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KOTLIN_VERSION: "2.4.20"
      KOTLIN_COMPILER_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Cache pinned Kotlin compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/kotlin-compiler-cache/kotlin-compiler-${{ env.KOTLIN_VERSION }}.zip
            ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-${{ env.KOTLIN_COMPILER_SHA256 }}
      - name: Cache kotlinc reference jars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kotlinc-ref-cache-jvm
          key: kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-backend-jvm-${{ hashFiles('Scripts/diff_cases/**/*.kt') }}
          restore-keys: |
            kotlinc-refs-v1-${{ runner.os }}-${{ env.KOTLIN_VERSION }}-backend-jvm-
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          CACHE_DIR="${RUNNER_TEMP}/kotlin-compiler-cache"
          KOTLIN_DIR="${RUNNER_TEMP}/kotlin-${KOTLIN_VERSION}"
          zip_path="${CACHE_DIR}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          mkdir -p "$CACHE_DIR"

          if [ ! -s "$zip_path" ]; then
            for attempt in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
                -o "$zip_path" \
                "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"; then
                break
              fi
              echo "Kotlin compiler download attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
              rm -f "$zip_path"
              sleep $((attempt * 10))
            done
            if [ ! -s "$zip_path" ]; then
              echo "Failed to download Kotlin compiler after 5 attempts" >&2
              exit 1
            fi
          fi
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$zip_path" "$KOTLIN_COMPILER_SHA256" "$KOTLIN_DIR" "$KOTLIN_VERSION"
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify prerequisites
        run: |
          java -version
          kotlinc -version
          "$KSWIFTC" --version || true
      - name: Build and statically validate the JVM stdlib jar
        run: |
          mkdir -p "$RUNNER_TEMP/jvm-stdlib"
          "$KSWIFTC" --stdlib-only --emit jar -o "$RUNNER_TEMP/jvm-stdlib/kswiftk-stdlib.jar"
          python3 Scripts/validate_jvm_stdlib.py "$RUNNER_TEMP/jvm-stdlib/kswiftk-stdlib.jar"
          python3 Scripts/tests/test_validate_jvm_stdlib.py
      - name: Run kotlinc diff cases through the JVM backend
        id: diff_kotlinc_jvm
        continue-on-error: true
        env:
          DIFF_BACKEND: jvm
          DIFF_JVM_STDLIB_JAR: ${{ runner.temp }}/jvm-stdlib/kswiftk-stdlib.jar
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_jvm_report.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_kotlinc_jvm_artifacts
          DIFF_COMPILE_TIMEOUT: "300"
          DIFF_RUN_TIMEOUT: "30"
          DIFF_LOG_PASS: "0"
          KOTLINC_REF_CACHE_DIR: ${{ runner.temp }}/kotlinc-ref-cache-jvm
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
        run: |
          DIFF_WORKERS="$(nproc)" \
            bash Scripts/diff_kotlinc.sh --report "$DIFF_REPORT" Scripts/diff_cases
      - name: Summarize JVM backend diff artifacts
        if: always() && steps.diff_kotlinc_jvm.outcome != 'cancelled'
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_jvm_report.tsv
        run: bash Scripts/diff_kotlinc_ci_summary.sh --report "$DIFF_REPORT"
      - name: Fail when JVM backend diff mismatches exist
        if: steps.diff_kotlinc_jvm.outcome == 'failure'
        run: |
          echo "kotlinc diff JVM backend cases failed." >&2
          exit 1
      - name: Upload JVM backend diff failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinc-diff-jvm-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diff_kotlinc_jvm_report.tsv
            ${{ runner.temp }}/diff_kotlinc_jvm_artifacts
          if-no-files-found: ignore
          retention-days: 30

  # WASM backend lane: marked cases (`// DIFF_WASM`) are compiled with
  # kswiftc --target wasm32-wasi and executed under both WASI engines
  # (node:wasi and wasmtime), still diffed against the kotlinc/JVM reference.
  verify-wasm:
    name: kotlinc Diff (WASM backend, ${{ matrix.engine }})
    needs: build-release-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [node, wasmtime]
    env:
      KOTLIN_VERSION: "2.4.20"
      KOTLIN_COMPILER_SHA256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
      WASMTIME_VERSION: "49.0.3"
      WASMTIME_SHA256: "4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Cache pinned Kotlin compiler archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/kotlin-compiler-cache/kotlin-compiler-${{ env.KOTLIN_VERSION }}.zip
            ${{ runner.temp }}/kotlin-tools
          key: kotlin-tools-${{ env.KOTLIN_VERSION }}-${{ env.KOTLIN_COMPILER_SHA256 }}
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Kotlin compiler
        run: |
          CACHE_DIR="${RUNNER_TEMP}/kotlin-compiler-cache"
          KOTLIN_DIR="${RUNNER_TEMP}/kotlin-${KOTLIN_VERSION}"
          zip_path="${CACHE_DIR}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          mkdir -p "$CACHE_DIR"

          if [ ! -s "$zip_path" ]; then
            for attempt in 1 2 3 4 5; do
              if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
                -o "$zip_path" \
                "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"; then
                break
              fi
              echo "Kotlin compiler download attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
              rm -f "$zip_path"
              sleep $((attempt * 10))
            done
            if [ ! -s "$zip_path" ]; then
              echo "Failed to download Kotlin compiler after 5 attempts" >&2
              exit 1
            fi
          fi
          bash Scripts/verify_kotlin_compiler_archive.sh \
            "$zip_path" "$KOTLIN_COMPILER_SHA256" "$KOTLIN_DIR" "$KOTLIN_VERSION"
          echo "${KOTLIN_DIR}/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify prerequisites
        run: |
          java -version
          kotlinc -version
          "$KSWIFTC" --version || true
      - name: Setup Node.js
        if: matrix.engine == 'node'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install wasmtime
        if: matrix.engine == 'wasmtime'
        run: |
          archive="$RUNNER_TEMP/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fSL --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 120 \
            -o "$archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar -xJf "$archive" -C "$RUNNER_TEMP/wasmtime" --strip-components=1
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"
          # $GITHUB_PATH applies to subsequent steps only; probe the absolute path here.
          "$RUNNER_TEMP/wasmtime/wasmtime" --version
      - name: Run kotlinc diff cases through the WASM backend
        id: diff_kotlinc_wasm
        continue-on-error: true
        env:
          DIFF_BACKEND: wasm
          DIFF_ENGINE: ${{ matrix.engine }}
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_wasm_report.tsv
          DIFF_ARTIFACT_ROOT: ${{ runner.temp }}/diff_kotlinc_wasm_artifacts
          DIFF_COMPILE_TIMEOUT: "600"
          DIFF_RUN_TIMEOUT: "60"
          DIFF_LOG_PASS: "0"
          KOTLINC_DEP_DIR: ${{ runner.temp }}/kotlin-tools
        run: |
          DIFF_WORKERS="$(nproc)" \
            bash Scripts/diff_kotlinc.sh --report "$DIFF_REPORT" Scripts/diff_cases
      - name: Summarize WASM backend diff artifacts
        if: always() && steps.diff_kotlinc_wasm.outcome != 'cancelled'
        env:
          DIFF_REPORT: ${{ runner.temp }}/diff_kotlinc_wasm_report.tsv
        run: bash Scripts/diff_kotlinc_ci_summary.sh --report "$DIFF_REPORT"
      - name: Fail when WASM backend diff mismatches exist
        if: steps.diff_kotlinc_wasm.outcome == 'failure'
        run: |
          echo "kotlinc diff WASM backend cases failed." >&2
          exit 1
      - name: Upload WASM backend diff failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinc-diff-wasm-${{ github.run_id }}-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/diff_kotlinc_wasm_report.tsv
            ${{ runner.temp }}/diff_kotlinc_wasm_artifacts
          if-no-files-found: ignore
          retention-days: 30

  mutation-fuzzer:
    name: Bounded mutation fuzzer and crash corpus replay
    needs: build-release-kswiftc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUZZ_SEED: "23023"
      FUZZ_CASES: "64"
      FUZZ_DURATION_SECONDS: "900"
      # A single kswiftc compile (sema through link) legitimately takes tens of
      # seconds on this runner; the CI diff job allows 180s per compile for the
      # same kswiftc + KSwiftKStdlib.kklib path. A smaller budget turns every
      # compilable case into a bogus "timeout" finding.
      FUZZ_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
      - name: Download release compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kswiftc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/kswiftc-release-artifact
      - name: Verify and extract release compiler artifact
        run: |
          artifact_dir="$RUNNER_TEMP/kswiftc-release-artifact"
          install_dir="$RUNNER_TEMP/kswiftc-release"
          (
            cd "$artifact_dir"
            sha256sum --check kswiftc-release.tar.zst.sha256
          )
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -I zstd -xf "$artifact_dir/kswiftc-release.tar.zst" -C "$install_dir"
          test -x "$install_dir/kswiftc"
          echo "KSWIFTC=$install_dir/kswiftc" >> "$GITHUB_ENV"
      - name: Build shared stdlib artifact
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-mutation-fuzzer"
          "$KSWIFTC" --stdlib-only --emit library \
            -o "$RUNNER_TEMP/nightly-mutation-fuzzer/KSwiftKStdlib.kklib"
      - name: Replay committed crash corpus
        run: |
          python3 Scripts/mutate_diff_cases.py \
            --kswiftc "$KSWIFTC" \
            --replay-dir Tests/CrashCorpus \
            --stdlib-library "$RUNNER_TEMP/nightly-mutation-fuzzer/KSwiftKStdlib.kklib" \
            --timeout-seconds "$FUZZ_TIMEOUT_SECONDS" \
            --workers 1
      - name: Baseline compile sanity check
        run: |
          # Guardrail: an unmutated known-good input must compile within the
          # fuzz timeout. Otherwise every compilable mutation case is reported
          # as a bogus timeout finding instead of a real signal.
          start=$(date +%s)
          if timeout "$FUZZ_TIMEOUT_SECONDS" "$KSWIFTC" \
            --no-stdlib \
            --stdlib-library "$RUNNER_TEMP/nightly-mutation-fuzzer/KSwiftKStdlib.kklib" \
            Scripts/diff_cases/hello.kt \
            -o "$RUNNER_TEMP/nightly-mutation-fuzzer/baseline-hello"; then
            echo "Baseline hello.kt compile finished in $(( $(date +%s) - start ))s (budget: ${FUZZ_TIMEOUT_SECONDS}s)"
          else
            rc=$?
            echo "::error::Baseline compile of Scripts/diff_cases/hello.kt failed or exceeded the ${FUZZ_TIMEOUT_SECONDS}s fuzz timeout (rc=$rc). Raise FUZZ_TIMEOUT_SECONDS or fix the environment before trusting timeout findings."
            exit "$rc"
          fi
      - name: Run bounded mutation fuzzer
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-mutation-fuzzer/corpus"
          python3 Scripts/mutate_diff_cases.py \
            --kswiftc "$KSWIFTC" \
            --stdlib-library "$RUNNER_TEMP/nightly-mutation-fuzzer/KSwiftKStdlib.kklib" \
            --seed-dir Scripts/diff_cases \
            --seed "$FUZZ_SEED" \
            --cases "$FUZZ_CASES" \
            --duration-seconds "$FUZZ_DURATION_SECONDS" \
            --timeout-seconds "$FUZZ_TIMEOUT_SECONDS" \
            --workers 1 \
            --corpus-dir "$RUNNER_TEMP/nightly-mutation-fuzzer/corpus" \
            --report "$RUNNER_TEMP/nightly-mutation-fuzzer/report.json"
      - name: Upload fuzzer artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-mutation-fuzzer-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-mutation-fuzzer
          if-no-files-found: warn
          retention-days: 30

  audits:
    name: Dead code and fiction audits
    needs: build-debug-tests
    if: always() && needs.build-debug-tests.outputs.bundle == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KSWIFTK_CI_FAST_BUILD: "1"
      SWIFT_BUILD_SYSTEM: native
      SWIFT_ENABLE_COMPILE_CACHE: "1"
      SWIFT_ENABLE_CACHE_REMARKS: "1"
      SWIFT_CAS_PATH: ${{ github.workspace }}/.build/out/CompilationCache.noindex
      SWIFT_XSWIFTC_FLAGS: -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Linux runner
        uses: ./.github/actions/setup-self-hosted
      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Download debug test bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-debug-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/swift-debug-tests-artifact
      - name: Verify and extract debug test bundle
        run: |
          artifact_dir="$RUNNER_TEMP/swift-debug-tests-artifact"
          archive_path="$RUNNER_TEMP/swift-debug-tests.tar.zst"
          cat "$artifact_dir"/swift-debug-tests.tar.zst.part-* > "$archive_path"
          (
            cd "$RUNNER_TEMP"
            cp "$artifact_dir/swift-debug-tests.tar.zst.sha256" .
            sha256sum --check swift-debug-tests.tar.zst.sha256
          )
          rm -rf .build
          tar -I zstd -xf "$archive_path" -C "$GITHUB_WORKSPACE"
          test -d .build
          mkdir -p "$SWIFT_CAS_PATH"
      - name: Run dead-code audit
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-audits/dead-code"
          bash Scripts/dead_code_audit.sh \
            --output-dir "$RUNNER_TEMP/nightly-audits/dead-code" \
            --verbose | tee "$RUNNER_TEMP/nightly-audits/dead-code-summary.txt"
      - name: Run fiction audit
        env:
          DUMP_SURFACE: "1"
        run: |
          bash Scripts/swift_test.sh --skip-build --no-parallel \
            --filter FictionAuditDumpTests \
            $SWIFT_XSWIFTC_FLAGS \
            | tee "$RUNNER_TEMP/nightly-audits/fiction-audit.txt"
      - name: Summarize audits
        run: |
          {
            echo '## Nightly audits'
            echo
            echo '### Dead code'
            echo '```text'
            cat "$RUNNER_TEMP/nightly-audits/dead-code-summary.txt"
            echo '```'
            echo
            echo '### Fiction audit'
            echo '```text'
            cat "$RUNNER_TEMP/nightly-audits/fiction-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-audits-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-audits
          if-no-files-found: error
          retention-days: 30

  kotlinx-io-reference:
    name: kotlinx-io upstream reference (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: jvm
            runner: ubuntu-latest
          - kind: native
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test classification and identity guards
        run: python3 -m unittest discover -s Scripts/kotlinx_io_upstream/tests -v
      - name: Install locked reference SDK, dependencies and unchanged upstream sources
        env:
          KIO_REFERENCE_KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          kio_target=$(python3 - <<'PY'
          import os, platform
          if os.environ['KIO_REFERENCE_KIND'] == 'jvm':
              print('jvm')
          else:
              assert platform.system() == 'Darwin'
              print({'arm64': 'macos_arm64', 'x86_64': 'macos_x64'}[platform.machine()])
          PY
          )
          python3 Scripts/kotlinx_io_upstream/prepare_reference.py \
            --target "$kio_target" --output "$RUNNER_TEMP/kio-reference-install" \
            2>&1 | tee "$RUNNER_TEMP/kio-reference-prepare.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          paths = json.loads((Path(os.environ['RUNNER_TEMP']) / 'kio-reference-install/paths.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in paths.items():
                  output.write('KIO_' + key.upper() + '=' + str(value) + '\n')
          PY
      - name: Execute original JVM assertions and all concrete factories
        if: matrix.kind == 'jvm'
        shell: bash
        run: |
          python3 Scripts/kotlinx_io_upstream/run_jvm_reference.py \
            --upstream "$KIO_UPSTREAM" --kotlin-home "$KIO_INSTALLATION" \
            --java "$JAVA_HOME/bin/java" --dependencies "$KIO_DEPENDENCIES" \
            --output "$RUNNER_TEMP/kio-reference-results"
      - name: Execute original Native common and Apple assertions
        if: matrix.kind == 'native'
        shell: bash
        run: |
          python3 Scripts/kotlinx_io_upstream/run_native_reference.py \
            --target "$KIO_TARGET" --upstream "$KIO_UPSTREAM" \
            --kotlin-home "$KIO_INSTALLATION" --compiler-archive "$KIO_COMPILER_ARCHIVE" \
            --java "$JAVA_HOME/bin/java" --konan-data "$RUNNER_TEMP/kio-konan-data" \
            --dependencies "$KIO_DEPENDENCIES" --output "$RUNNER_TEMP/kio-reference-results"
      - name: Preserve raw results, discovery, commands, SDK hashes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-reference-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kio-reference-results/
            ${{ runner.temp }}/kio-reference-install/paths.json
            ${{ runner.temp }}/kio-reference-install/install-plan.json
            ${{ runner.temp }}/kio-reference-install/prepare-git-*
            ${{ runner.temp }}/kio-reference-prepare.log
          if-no-files-found: warn

  kotlinx-io-apple-candidate:
    name: Darwin SDK and Apple IO focused candidate
    runs-on: macos-26
    # Existing runner bounds: build 600 + Core 1200 + Runtime 900 + Backend
    # 3600 seconds. Leave setup/upload margin; retried wrapper runs cannot pass the audit.
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      KSWIFTK_IO1763_RECEIPT_DIRECTORY: ${{ github.workspace }}/apple-candidate-receipts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an installed full Xcode that actually provides Swift 6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apple-candidate-receipts
          python3 - <<'PY'
          import glob, json, pathlib, re, subprocess
          active = subprocess.check_output(["xcode-select", "--print-path"], text=True).strip()
          candidates = list(dict.fromkeys([active] + sorted(
              glob.glob("/Applications/Xcode*.app/Contents/Developer"), reverse=True)))
          observed = []
          selected = None
          for developer in candidates:
              swift = pathlib.Path(developer) / "Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
              row = {"developer_dir": developer, "swift": str(swift), "exists": swift.is_file()}
              if swift.is_file():
                  result = subprocess.run([str(swift), "--version"], text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
                  row.update(exit=result.returncode, stdout=result.stdout, stderr=result.stderr)
                  match = re.search(r"Swift version ([0-9]+\.[0-9]+)(?:\.|\s|$)", result.stdout)
                  if result.returncode == 0 and match and match.group(1) == "6.3" and selected is None:
                      selected = developer
              observed.append(row)
          pathlib.Path("apple-candidate-receipts/xcode-candidates.json").write_text(
              json.dumps({"required_swift": "6.3", "selected": selected, "observed": observed}, indent=2) + "\n")
          if selected is None:
              raise SystemExit("No installed full Xcode provides required Swift 6.3; no candidate gate started")
          pathlib.Path("apple-candidate-receipts/selected-developer-dir.txt").write_text(selected + "\n")
          PY
          selected_developer_dir="$(cat apple-candidate-receipts/selected-developer-dir.txt)"
          sudo xcode-select --switch "$selected_developer_dir"
      - name: Verify selected Swift 6.3 toolchain
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"
      - name: Configure actual Darwin SDK, modern Bash and LLVM
        shell: bash
        run: |
          set -euo pipefail
          brew install bash grep llvm
          bash_prefix="$(brew --prefix bash)"
          llvm_prefix="$(brew --prefix llvm)"
          grep_prefix="$(brew --prefix grep)"
          "$bash_prefix/bin/bash" -c '(( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 3) ))'
          llvm_dylib="$llvm_prefix/lib/libLLVM.dylib"
          [[ -f "$llvm_dylib" ]]
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          [[ -d "$sdkroot/System/Library/Frameworks/Foundation.framework" ]]
          [[ -d "$sdkroot/System/Library/Frameworks/CoreFoundation.framework" ]]
          {
            echo "$bash_prefix/bin"
            echo "$grep_prefix/libexec/gnubin"
            echo "$llvm_prefix/bin"
          } >> "$GITHUB_PATH"
          {
            echo "SDKROOT=$sdkroot"
            echo "KSWIFTK_LLVM_DYLIB=$llvm_dylib"
            echo "C_INCLUDE_PATH=$llvm_prefix/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
            echo "LIBRARY_PATH=$llvm_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          sw_vers > apple-candidate-receipts/host.txt
          uname -a > apple-candidate-receipts/uname.txt
          xcodebuild -version > apple-candidate-receipts/xcode.txt
          xcrun --sdk macosx --show-sdk-version > apple-candidate-receipts/sdk-version.txt
          printf '%s\n' "$sdkroot" > apple-candidate-receipts/sdk-path.txt
          swift --version > apple-candidate-receipts/swift.txt
          python3 --version > apple-candidate-receipts/python.txt
          "$llvm_prefix/bin/clang" --version > apple-candidate-receipts/clang.txt
          "$bash_prefix/bin/bash" --version > apple-candidate-receipts/bash.txt
          "$llvm_prefix/bin/llvm-config" --version > apple-candidate-receipts/llvm-version.txt
          "$grep_prefix/libexec/gnubin/grep" --version > apple-candidate-receipts/grep.txt
          brew info --json=v2 bash grep llvm > apple-candidate-receipts/homebrew-toolchains.json
          git rev-parse HEAD > apple-candidate-receipts/head.txt
          git status --porcelain=v1 > apple-candidate-receipts/status.before.txt
          python3 - "$llvm_dylib" "$bash_prefix/bin/bash" "$(command -v swift)" <<'PY'
          import hashlib, json, pathlib, sys
          def record(raw):
              path = pathlib.Path(raw).resolve()
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return {"requested_path": raw, "resolved_path": str(path),
                  "bytes": path.stat().st_size, "sha256": digest.hexdigest()}
          pathlib.Path("apple-candidate-receipts/toolchain-binaries.json").write_text(
              json.dumps([record(raw) for raw in sys.argv[1:]], indent=2) + "\n")
          PY
      - name: Fresh build and exact focused gates, sequential ownership
        shell: bash
        run: |
          set -euo pipefail
          bash -c '(( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 3) ))'
          python3 Scripts/kotlinx_io_upstream/apple/run_candidate.py --receipts apple-candidate-receipts
          python3 Scripts/kotlinx_io_upstream/apple/verify_candidate_receipts.py --receipts apple-candidate-receipts
      - name: Preserve raw failures, SDK inputs and successful scoped proofs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: io-apple-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: apple-candidate-receipts
          if-no-files-found: error

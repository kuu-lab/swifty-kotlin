name: Swift Build Preview

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Keep this lane independent of the standard CI so that the preview build system
# can be compared against the native build without blocking it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-swiftbuild:
    name: Verification (swiftbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SWIFT_BUILD_SYSTEM: swiftbuild
    steps:
      - uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./.github/actions/setup-swift
        with:
          swift-version: "6.3"

      - name: Show toolchain versions
        run: swift --version

      - name: Build compiler and tests with swiftbuild
        env:
          SWIFT_TEST_BUILD_JOBS: "4"
        run: |
          bash Scripts/build_swift_tests.sh \
            -j "$SWIFT_TEST_BUILD_JOBS" \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warn-concurrency

      - name: Run smoke tests with swiftbuild
        env:
          SWIFT_TEST_PARALLEL: "1"
          SWIFT_TEST_WORKERS: "4"
          SWIFT_TEST_BUILD_JOBS: "4"
        run: |
          bash Scripts/swift_test.sh --skip-build --filter SmokeTests \
            -Xswiftc -swift-version -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warn-concurrency

      - name: Build release kswiftc with swiftbuild
        env:
          SWIFT_BUILD_JOBS: "4"
        run: |
          swift build --build-system swiftbuild -c release --product kswiftc \
            -j "$SWIFT_BUILD_JOBS"

      - name: Run minimal end-to-end compiler test
        run: |
          kswiftc_bin="$(swift build --build-system swiftbuild -c release --product kswiftc --show-bin-path)/kswiftc"
          "$kswiftc_bin" Scripts/diff_cases/hello.kt -o /tmp/swiftbuild_hello
          /tmp/swiftbuild_hello

      - name: Reproduce hints
        if: always()
        run: |
          {
            echo '## Swift Build preview reproduce'
            echo '```bash'
            echo 'SWIFT_BUILD_SYSTEM=swiftbuild SWIFT_TEST_BUILD_JOBS=4 bash Scripts/build_swift_tests.sh -j 4 -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency'
            echo 'SWIFT_BUILD_SYSTEM=swiftbuild SWIFT_TEST_PARALLEL=1 SWIFT_TEST_WORKERS=4 SWIFT_TEST_BUILD_JOBS=4 bash Scripts/swift_test.sh --skip-build --filter SmokeTests -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency'
            echo 'swift build --build-system swiftbuild -c release --product kswiftc -j 4'
            echo 'KSWIFTC="$(swift build --build-system swiftbuild -c release --product kswiftc --show-bin-path)/kswiftc"; "$KSWIFTC" Scripts/diff_cases/hello.kt -o /tmp/swiftbuild_hello && /tmp/swiftbuild_hello'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

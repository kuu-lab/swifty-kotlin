name: kotlinx-io full compatibility gate

on:
  workflow_dispatch:
  schedule:
    # Run after the repository-wide nightly suite; this workflow stays scoped to kotlinx-io.
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  api-audit:
    name: API inventory and coverage audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/api
      - name: Test strict gate failure detection
        run: python3 -m unittest discover -s Scripts/kotlinx_io_upstream/tests -p 'test_verify_gate.py' -v
      - name: Reject incomplete API and test mappings
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py audit
          --root . --output gate-artifacts/api --commit "$GITHUB_SHA"
      - name: Write same-commit job receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job api-audit --workflow-job "$GITHUB_JOB" --status "$JOB_STATUS"
          --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --output gate-artifacts/job-receipt.json
      - name: Preserve API ledger and coverage mapping
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/api
          if-no-files-found: error
      - name: Preserve job receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-receipt-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/job-receipt.json
          if-no-files-found: error

  upstream-reference:
    name: Upstream reference (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: jvm
            runner: ubuntu-24.04
          - kind: native-apple
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/reference
      - name: Verify pinned harness tests
        run: python3 -m unittest discover -s Scripts/kotlinx_io_upstream/tests -v
      - name: Install the locked reference SDK, dependencies and upstream sources
        env:
          KIO_REFERENCE_KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          set -euo pipefail
          kio_target="$(python3 - <<'PY'
          import os
          import platform
          if os.environ["KIO_REFERENCE_KIND"] == "jvm":
              print("jvm")
          else:
              assert platform.system() == "Darwin"
              print({"arm64": "macos_arm64", "x86_64": "macos_x64"}[platform.machine()])
          PY
          )"
          python3 Scripts/kotlinx_io_upstream/prepare_reference.py \
            --target "$kio_target" --output "$RUNNER_TEMP/kio-reference-install" \
            2>&1 | tee gate-artifacts/reference/prepare.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          paths = json.loads((Path(os.environ["RUNNER_TEMP"]) / "kio-reference-install/paths.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in paths.items():
                  output.write("KIO_" + key.upper() + "=" + str(value) + "\n")
          PY
      - name: Run every locked JVM upstream execution
        if: matrix.kind == 'jvm'
        run: >-
          python3 Scripts/kotlinx_io_upstream/run_jvm_reference.py
          --upstream "$KIO_UPSTREAM" --kotlin-home "$KIO_INSTALLATION"
          --java "$JAVA_HOME/bin/java" --dependencies "$KIO_DEPENDENCIES"
          --output gate-artifacts/reference/results
      - name: Run every locked common and Apple Native upstream execution
        if: matrix.kind == 'native-apple'
        run: >-
          python3 Scripts/kotlinx_io_upstream/run_native_reference.py
          --target "$KIO_TARGET" --upstream "$KIO_UPSTREAM"
          --kotlin-home "$KIO_INSTALLATION" --compiler-archive "$KIO_COMPILER_ARCHIVE"
          --java "$JAVA_HOME/bin/java" --konan-data "$RUNNER_TEMP/kio-konan-data"
          --dependencies "$KIO_DEPENDENCIES" --output gate-artifacts/reference/results
      - name: Write same-commit reference receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job "reference-${{ matrix.kind }}" --workflow-job "$GITHUB_JOB"
          --status "$JOB_STATUS" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --output gate-artifacts/job-receipt.json
      - name: Upload reference execution maps, results and raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-reference-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  f02-matrix:
    name: O0/O2 stdlib and consumer matrix
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-kotlinx-io-gate
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/f02
      - name: Build the compiler
        run: swift build
      - name: Prepare the pinned JVM reference tools
        run: |
          set -euo pipefail
          python3 Scripts/kotlinx_io_upstream/prepare_reference.py \
            --target jvm --output "$RUNNER_TEMP/kio-jvm-install" \
            2>&1 | tee gate-artifacts/f02/prepare-reference.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          paths = json.loads((Path(os.environ["RUNNER_TEMP"]) / "kio-jvm-install/paths.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in paths.items():
                  output.write("KIO_" + key.upper() + "=" + str(value) + "\n")
          PY
      - name: Run all API consumers on source/artifact/producer-consumer routes at O0 and O2
        run: >-
          python3 Scripts/io_api_inventory/run_f02_matrix.py
          --compiler .build/debug/kswiftc --output gate-artifacts/f02/results
          --kotlin-home "$KIO_INSTALLATION" --java "$JAVA_HOME/bin/java"
          --dependencies "$KIO_DEPENDENCIES" --compile-timeout 1800
      - name: Write same-commit matrix receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job f02-matrix --workflow-job "$GITHUB_JOB" --status "$JOB_STATUS"
          --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --output gate-artifacts/job-receipt.json
      - name: Upload F02 matrix results and raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-f02-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  candidate-native:
    name: Upstream Native assertions (${{ matrix.route }} / ${{ matrix.optimization }})
    strategy:
      fail-fast: false
      matrix:
        route: [source, stdlib-library, producer-consumer]
        optimization: [O0, O2]
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-kotlinx-io-gate
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/candidate
      - name: Build the compiler
        run: swift build
      - name: Execute the complete macOS upstream catalog on the selected route
        shell: bash
        run: |
          set -euo pipefail
          lane_output="gate-artifacts/candidate/${{ matrix.route }}-${{ matrix.optimization }}"
          arguments=(--stdlib-from-source)
          if [[ "${{ matrix.route }}" != "source" ]]; then
            stdlib_library="gate-artifacts/candidate/KSwiftKStdlib.kklib"
            .build/debug/kswiftc --stdlib-only --no-incremental -o "$stdlib_library"
            arguments=(--stdlib-library "$stdlib_library")
          fi
          if [[ "${{ matrix.route }}" == "producer-consumer" ]]; then
            arguments+=(--test-library)
          fi
          python3 Scripts/kotlinx_io_upstream/run_candidate_suites.py \
            --upstream Scripts/io_api_inventory/upstream/kotlinx-io-0.9.1 \
            --compiler .build/debug/kswiftc --package-root . \
            --native-catalog macos "${arguments[@]}" \
            --optimization "${{ matrix.optimization }}" \
            --compile-timeout 1800 --run-timeout 600 --output "$lane_output"
      - name: Write same-commit candidate receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job "candidate-${{ matrix.route }}-${{ matrix.optimization }}" --workflow-job "$GITHUB_JOB"
          --status "$JOB_STATUS" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "gate-artifacts/candidate/job-receipt.json"
      - name: Upload upstream candidate catalog results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-candidate-${{ matrix.route }}-${{ matrix.optimization }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  ktor-consumer:
    name: Pinned Ktor consumer O0/O2
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-kotlinx-io-gate
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/ktor/out
      - name: Build the compiler
        run: swift build
      - name: Build and execute the pinned Ktor IO consumer
        shell: bash
        run: |
          set +e
          KSWIFTC="$GITHUB_WORKSPACE/.build/debug/kswiftc" \
          KTOR_IO_CACHE_DIR="$RUNNER_TEMP/ktor-io-consumer" \
          KTOR_IO_OUT_DIR="$GITHUB_WORKSPACE/gate-artifacts/ktor/out" \
            bash Scripts/ktor_io_consumer.sh 2>&1 | tee gate-artifacts/ktor/consumer.log
          result=${PIPESTATUS[0]}
          set -e
          python3 - "$result" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path("gate-artifacts/ktor")
          output = (root / "consumer.log").read_text(errors="replace")
          lanes = [line for line in output.splitlines() if line.startswith("PASS ktor_io_macos compile + consumer link/run")]
          summary = {"kind": "ktor-io-consumer", "status": "PASS" if int(sys.argv[1]) == 0 and len(lanes) == 2 else "FAIL",
              "optimization_lanes": lanes, "expected_lane_count": 2, "exit_code": int(sys.argv[1])}
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          if summary["status"] != "PASS":
              raise SystemExit(1)
          PY
      - name: Write same-commit consumer receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job ktor-consumer --workflow-job "$GITHUB_JOB" --status "$JOB_STATUS"
          --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --output gate-artifacts/job-receipt.json
      - name: Upload Ktor consumer outputs and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-ktor-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  kotlinx-diff:
    name: All kotlinx_io diff cases (${{ matrix.optimization }})
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-kotlinx-io-gate
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/diff
      - name: Build the compiler
        run: swift build
      - name: Prepare the pinned JVM reference tools
        run: |
          set -euo pipefail
          python3 Scripts/kotlinx_io_upstream/prepare_reference.py \
            --target jvm --output "$RUNNER_TEMP/kio-jvm-install" \
            2>&1 | tee gate-artifacts/diff/prepare-reference.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          paths = json.loads((Path(os.environ["RUNNER_TEMP"]) / "kio-jvm-install/paths.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in paths.items():
                  output.write("KIO_" + key.upper() + "=" + str(value) + "\n")
          PY
      - name: Compare every kotlinx_io diff case at the selected optimization
        run: >-
          python3 Scripts/kotlinx_io_upstream/run_diff_gate.py
          --compiler .build/debug/kswiftc --kotlinc "$KIO_INSTALLATION/bin/kotlinc"
          --java "$JAVA_HOME/bin/java"
          --classpath "$KIO_DEPENDENCIES/kotlinx-io-core-jvm-0.9.1.jar"
          --classpath "$KIO_DEPENDENCIES/kotlinx-io-bytestring-jvm-0.9.1.jar"
          --optimization "${{ matrix.optimization }}"
          --output "gate-artifacts/diff/${{ matrix.optimization }}"
      - name: Write same-commit diff receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job "diff-${{ matrix.optimization }}" --workflow-job "$GITHUB_JOB"
          --status "$JOB_STATUS" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "gate-artifacts/diff/job-receipt.json"
      - name: Upload diff case manifests, results and raw logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-diff-${{ matrix.optimization }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  related-goldens:
    name: Related Sema golden tests
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-kotlinx-io-gate
      - name: Create evidence directory
        run: mkdir -p gate-artifacts/goldens
      - name: Run the Sema golden suite containing kotlinx-io fixtures
        shell: bash
        run: |
          set +e
          bash Scripts/swift_test.sh --filter CompilerCoreTests.GoldenSemaGoldenTests/matchesGolden \
            -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee gate-artifacts/goldens/swift-test.log
          result=${PIPESTATUS[0]}
          set -e
          python3 - "$result" <<'PY'
          import json
          import pathlib
          import sys
          result = int(sys.argv[1])
          pathlib.Path("gate-artifacts/goldens/summary.json").write_text(json.dumps({
              "kind": "related-sema-goldens", "status": "PASS" if result == 0 else "FAIL",
              "exit_code": result,
              "filter": "CompilerCoreTests.GoldenSemaGoldenTests/matchesGolden",
          }, indent=2) + "\n")
          raise SystemExit(result)
          PY
      - name: Write same-commit golden receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py receipt
          --job related-goldens --workflow-job "$GITHUB_JOB" --status "$JOB_STATUS"
          --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT" --output gate-artifacts/job-receipt.json
      - name: Upload golden results and build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-goldens-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts
          if-no-files-found: error

  gate-summary:
    name: KUU-1826 integrated gate summary
    if: ${{ always() }}
    needs: [api-audit, upstream-reference, f02-matrix, candidate-native, ktor-consumer, kotlinx-diff, related-goldens]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download every gate artifact from this workflow run
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kotlinx-io-gate-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-evidence
          merge-multiple: false
      - name: Verify same-SHA receipts and all recorded summaries
        if: always()
        env:
          JOB_RESULTS_JSON: ${{ toJSON(needs) }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 Scripts/kotlinx_io_upstream/verify_gate.py finalize
          --evidence gate-evidence --job-results-json "$JOB_RESULTS_JSON"
          --expected-receipts "api-audit,reference-jvm,reference-native-apple,f02-matrix,candidate-source-O0,candidate-source-O2,candidate-stdlib-library-O0,candidate-stdlib-library-O2,candidate-producer-consumer-O0,candidate-producer-consumer-O2,ktor-consumer,diff-O0,diff-O2,related-goldens"
          --commit "$EXPECTED_COMMIT" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --output gate-artifacts/final
      - name: Publish the final same-SHA summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlinx-io-gate-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-artifacts/final
          if-no-files-found: error

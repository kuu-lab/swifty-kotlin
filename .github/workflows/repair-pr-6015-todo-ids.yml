name: One-shot repair PR 6015 TODO IDs

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 6015 && github.head_ref == 'claude/keen-hermann-8a3817'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/keen-hermann-8a3817"
          fetch-depth: 0

      - name: Repair TODO IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("TODO.md")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          old_219 = "- [ ] BUG-219: Kotlin の modifier keyword（"
          new_221 = "- [ ] BUG-221: Kotlin の modifier keyword（"
          old_220 = "- [ ] BUG-220: コンストラクタパラメータ名が文字どおり `inner`"
          new_220 = "- [x] BUG-220: コンストラクタパラメータ名が文字どおり `inner`"

          seen_219 = 0
          seen_220 = 0
          changed = False

          for index, line in enumerate(lines):
              if line.startswith(old_219):
                  lines[index] = line.replace("- [ ] BUG-219:", "- [ ] BUG-221:", 1)
                  seen_219 += 1
                  changed = True
              elif line.startswith(new_221):
                  seen_219 += 1

              if line.startswith(old_220):
                  lines[index] = line.replace("- [ ] BUG-220:", "- [x] BUG-220:", 1)
                  seen_220 += 1
                  changed = True
              elif line.startswith(new_220):
                  seen_220 += 1

          if seen_219 != 1 or seen_220 != 1:
              raise SystemExit(
                  f"Unexpected TODO state: residual-keyword-task={seen_219}, fixed-inner-task={seen_220}"
              )

          if changed:
              path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify TODO IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          pattern = re.compile(r"^- \[[ x]\] ([A-Z]+(?:-[A-Z]+)*-[0-9]+):")
          ids = []
          for line in Path("TODO.md").read_text(encoding="utf-8").splitlines():
              match = pattern.match(line)
              if match:
                  ids.append(match.group(1))

          duplicates = sorted(task_id for task_id, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit("Duplicate TODO task IDs: " + ", ".join(duplicates))
          print("No duplicate TODO task IDs found in TODO.md.")
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- TODO.md; then
            echo "TODO.md is already repaired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md
          git commit -m "fix(todo): resolve task ID collision after master merge"
          git push origin HEAD:refs/heads/claude/keen-hermann-8a3817

plugins {
    id 'com.android.application' version '9.5.1'
}

android {
    namespace 'org.swiftykotlin.composeprobe'
    compileSdkVersion 'android-36.1'
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'org.swiftykotlin.composeprobe'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-reflect'
}

def androidApis = [
    activity: 'androidx.activity:activity:1.9.3',
    core: 'androidx.core:core:1.13.1',
    runtime: 'androidx.compose.runtime:runtime-android:1.7.8',
    ui: 'androidx.compose.ui:ui-android:1.7.8',
    foundation: 'androidx.compose.foundation:foundation-android:1.7.8',
    layout: 'androidx.compose.foundation:foundation-layout-android:1.7.8',
    material3: 'androidx.compose.material3:material3-android:1.3.2',
]
dependencies {
    implementation files('build/kswiftk/kswiftk-stdlib.jar', 'build/kswiftk/counter.jar')
}
androidApis.each { name, coordinates ->
    configurations.create(name + 'Aar') {
        canBeConsumed = false
        transitive = false
    }
    dependencies.add(name + 'Aar', coordinates + '@aar')
    dependencies.add('implementation', coordinates)
}

tasks.register('extractComposeApis', Copy) {
    androidApis.keySet().each { name ->
        from({ zipTree(configurations[name + 'Aar'].singleFile) }) {
            include 'classes.jar'
            rename { name + '.jar' }
        }
    }
    into layout.buildDirectory.dir('kswiftk')
}
